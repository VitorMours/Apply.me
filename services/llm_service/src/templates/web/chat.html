<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Service Chat</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', path='css/style.css') }}"
  >
</head>
<body>

  <div class="d-flex vh-100">

    <aside class="d-flex flex-column bg-dark text-white" style="width: 280px; min-width: 280px;">
      <nav class="d-flex flex-column h-100 p-2">
        <button class="btn btn-outline-light d-flex align-items-center gap-2 mb-3" type="button" id="new-chat-btn">
          <span>+</span> Nova conversa
        </button>

        <ul class="nav nav-pills flex-column mb-auto overflow-auto" id="conversation-list">
          <li class="nav-item">
            <a href="#" class="nav-link active text-white" aria-current="page">Conversa 1</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link text-white">Conversa 2</a>
          </li>
        </ul>

        <hr>
        <div class="dropdown">
          <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
            <span class="rounded-circle bg-secondary me-2" style="width:32px;height:32px;"></span>
            <strong>Vitor</strong>
          </a>
          <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
            <li><a class="dropdown-item" href="#">Configurações</a></li>
            <li><a class="dropdown-item" href="#">Sair</a></li>
          </ul>
        </div>
      </nav>
    </aside>

    <div class="d-flex flex-column flex-grow-1">

      <header class="border-bottom p-3 d-flex align-items-center justify-content-between">
        <h1 class="h5 mb-0">Chat</h1>
      </header>

      <main class="d-flex flex-column flex-grow-1 overflow-hidden">

        <section id="messages" class="flex-grow-1 overflow-auto p-4 d-flex flex-column gap-3">
          <div class="d-flex justify-content-end">
            <div class="bg-primary text-white rounded-3 p-3" style="max-width: 70%;">
              Olá! Pode me explicar como funciona um circuit breaker?
            </div>
          </div>
          <div class="d-flex justify-content-start">
            <div class="bg-light border rounded-3 p-3" style="max-width: 70%;">
              Claro! Um circuit breaker tem três estados: Closed, Open e Half-Open...
            </div>
          </div>
        </section>

        <section class="border-top p-3">
          <form id="chat-form" class="d-flex gap-2">
            <textarea
              id="chat-input"
              class="form-control"
              rows="1"
              placeholder="Digite sua mensagem..."
              style="resize: none;"
            ></textarea>
            <button type="submit" class="btn btn-primary px-4">Enviar</button>
          </form>
        </section>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const userBubble = document.createElement('div');
      userBubble.className = 'd-flex justify-content-end';
      userBubble.innerHTML = `<div class="bg-primary text-white rounded-3 p-3" style="max-width: 70%;">${text}</div>`;
      messages.appendChild(userBubble);

      input.value = '';
      messages.scrollTop = messages.scrollHeight;

      // Aqui entraria a chamada ao seu endpoint FastAPI (fetch/POST)
    });
  </script>

</body>
</html>
